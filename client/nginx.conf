server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Requisições da API são encaminhadas ao container da API REST
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Aplicação de página única (SPA): rotas do React Router voltam para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
