# Ambiente virtualizado do LogiSync: banco de dados, API REST e aplicação web.
# Uso:  docker compose up --build -d     (detalhes no README.md)
# As senhas abaixo são padrões de desenvolvimento; em homologação/produção,
# defina-as no arquivo .env (veja .env.example).

services:
  db:
    image: mysql:8.4
    container_name: logisync-db
    restart: unless-stopped
    # horário de Brasília para NOW() e CURRENT_TIMESTAMP (atrasos e datas de cadastro)
    command: --default-time-zone=-03:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-logisync_root_dev}
      MYSQL_DATABASE: logisync
      MYSQL_USER: ${DB_USER:-logisync}
      MYSQL_PASSWORD: ${DB_PASSWORD:-logisync_dev}
    volumes:
      - db_data:/var/lib/mysql
      # executados apenas na primeira inicialização (volume vazio)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-logisync_root_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: logisync-api
    restart: unless-stopped
    environment:
      PORT: 3001
      APP_ENV: ${APP_ENV:-homologacao}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: logisync
      DB_USER: ${DB_USER:-logisync}
      DB_PASSWORD: ${DB_PASSWORD:-logisync_dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: logisync-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
